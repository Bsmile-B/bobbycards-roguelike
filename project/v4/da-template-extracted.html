<style>/* ============================================================
   BOBBYCARD ROGUELIKE — Joyful Direction
   Tokens partagés (à coller dans src/styles.css)
   ============================================================ */

:root {
  /* === Fond + neutres === Plus chauds, plus doux, jamais noir pur */
  --bg-deep: #1a1530;          /* nuit étoilée violet-bleu, pas noir */
  --bg-mid: #2a2147;           /* mid-tone pour panneaux */
  --bg-elevated: #3a2f5e;      /* éléments surélevés */
  --bg-cream: #fff5e1;         /* parchemin crème pour cartes */
  --bg-cream-deep: #f4e4c1;
  --ink: #261a3d;              /* texte foncé sur cream */
  --ink-soft: #4d3d6b;
  --ink-muted: #7a6c92;
  --paper: #fffbf0;
  --paper-line: #e8d5a8;

  /* === Couleurs de marque (joie, candy, mais pas pop fluo) === */
  --brand-coral:    oklch(72% 0.19 28);   /* corail chaud, signature */
  --brand-mint:     oklch(78% 0.13 165);  /* menthe douce */
  --brand-sun:      oklch(85% 0.15 85);   /* jaune soleil */
  --brand-sky:      oklch(75% 0.13 230);  /* bleu ciel */
  --brand-grape:    oklch(65% 0.18 305);  /* raisin */

  /* === Stages — chaque stage a une vibe colorée distincte === */
  --stage-1: oklch(72% 0.13 220);          /* "Prairie Givrée" — bleu glacier doux */
  --stage-1-deep: oklch(50% 0.13 230);
  --stage-1-cream: oklch(95% 0.04 220);

  --stage-2: oklch(70% 0.18 310);          /* "Jardin Magique" — violet pétillant */
  --stage-2-deep: oklch(45% 0.18 305);
  --stage-2-cream: oklch(95% 0.05 310);

  --stage-3: oklch(74% 0.18 50);           /* "Royaume Doré" — orange/or chaleureux */
  --stage-3-deep: oklch(50% 0.19 40);
  --stage-3-cream: oklch(96% 0.04 70);

  /* === Raretés — chacune a sa couleur, son halo, sa densité de particules === */
  --rarity-common: #9aa3b2;      /* gris-bleu tendre */
  --rarity-common-deep: #5e6878;
  --rarity-common-cream: #ecedf0;

  --rarity-rare: #4ec5e8;        /* cyan brillant */
  --rarity-rare-deep: #1f7fa8;
  --rarity-rare-cream: #e0f4fb;

  --rarity-epic: #b563ff;        /* violet magique */
  --rarity-epic-deep: #7a2dd0;
  --rarity-epic-cream: #f1e3ff;

  --rarity-legendary: #ffb938;   /* or pop */
  --rarity-legendary-deep: #cc7a00;
  --rarity-legendary-cream: #fff2d1;

  --rarity-mythic: #ff5fa2;      /* rose nacré (réservé) */
  --rarity-mythic-deep: #b8246a;
  --rarity-mythic-cream: #ffe1ee;

  /* === Stats fonctionnelles (combat) === */
  --hp-good: oklch(75% 0.18 145);     /* vert frais */
  --hp-warn: oklch(80% 0.18 75);      /* ambre */
  --hp-low:  oklch(68% 0.21 25);      /* rouge corail */
  --shield:  oklch(80% 0.10 220);     /* bleu pâle */
  --mana:    oklch(70% 0.16 270);     /* bleu-violet */
  --rage:    oklch(70% 0.21 35);      /* orange feu */
  --poison:  oklch(72% 0.18 140);     /* vert acide doux */

  /* === Coffres (5 tiers, du modeste au festif) === */
  --chest-wood: #c0894d;
  --chest-bronze: #d97a3c;
  --chest-silver: #b8c4d4;
  --chest-royal: #ffc845;
  --chest-runic: #5fdfff;          /* runique = féérique cyan, plus que sombre */

  /* === Espacement / radius / ombres — chunky === */
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --r-xl: 32px;
  --r-pill: 999px;

  --stroke: 3px solid var(--ink);   /* cerne épais Clash-style sur cartes */
  --stroke-thin: 2px solid var(--ink);

  /* "Sticker" shadow : lift épais sans flou (style autocollant) */
  --shadow-stick-sm: 0 3px 0 rgba(38, 26, 61, 0.35);
  --shadow-stick:    0 6px 0 rgba(38, 26, 61, 0.45);
  --shadow-stick-lg: 0 10px 0 rgba(38, 26, 61, 0.55);
  --shadow-glow:     0 0 32px;       /* couleur fournie par classe rareté */
  --shadow-soft:     0 8px 22px rgba(0,0,0,0.18);

  /* === Combat speed === */
  --combat-speed: 1;

  /* === Type === */
  --font-display: 'Lilita One', 'Fredoka', 'Baloo 2', system-ui, sans-serif; /* chunky cartoon */
  --font-body:    'Nunito', 'Quicksand', system-ui, sans-serif;             /* rond, lisible */
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;
}

/* === Reset léger === */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg-deep);
  -webkit-font-smoothing: antialiased;
}
</style>
<style>/* ============================================================
   Helpers visuels partagés entre artboards
   ============================================================ */

/* "Sky" backgrounds — plein de joie */
.bg-sky-day {
  background:
    radial-gradient(ellipse 600px 280px at 30% 18%, rgba(255,255,255,0.7), transparent 70%),
    radial-gradient(ellipse 500px 240px at 80% 28%, rgba(255,255,255,0.4), transparent 70%),
    linear-gradient(180deg, #b8e3ff 0%, #ffd6c2 100%);
}
.bg-sky-dusk {
  background:
    radial-gradient(circle at 80% 20%, #ffe6a0 0%, transparent 35%),
    linear-gradient(180deg, #6a4ca0 0%, #ff8b6f 65%, #ffd47a 100%);
}
.bg-meadow {
  background:
    radial-gradient(ellipse 700px 200px at 50% 100%, #67c97a, transparent),
    linear-gradient(180deg, #b8e3ff 0%, #d8f0c4 60%, #67c97a 100%);
}
.bg-night {
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0 1px, transparent 1px),
    radial-gradient(circle at 60% 70%, rgba(255,255,255,0.05) 0 1px, transparent 1px),
    radial-gradient(circle at 85% 25%, rgba(255,255,255,0.07) 0 1px, transparent 1px),
    radial-gradient(circle at 35% 80%, rgba(255,255,255,0.05) 0 1px, transparent 1px),
    radial-gradient(circle at 50% 50%, #3a2f5e, #1a1530);
}

/* Chunky button */
.btn {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--paper);
  border: var(--stroke);
  border-radius: var(--r-md);
  padding: 12px 22px;
  box-shadow: var(--shadow-stick);
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 120ms ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-stick-lg); }
.btn:active { transform: translateY(3px); box-shadow: var(--shadow-stick-sm); }
.btn--primary { background: var(--brand-coral); color: white; }
.btn--gold    { background: var(--brand-sun); }
.btn--mint    { background: var(--brand-mint); color: white; }
.btn--grape   { background: var(--brand-grape); color: white; }

/* Pill */
.pill {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 0.5px;
  text-transform: uppercase;

.fnum--dmg       { color: var(--hp-low); font-size: 30px; }
.fnum--dmg-small { color: var(--hp-warn); font-size: 22px; animation-delay: 0.2s; }
.fnum--heal      { color: var(--hp-good); font-size: 26px; animation-delay: 0.5s; }
@keyframes fnum-rise {
  0%   { transform: translateY(0) scale(0.6); opacity: 0; }
  20%  { transform: translateY(-10px) scale(1.15); opacity: 1; }
  60%  { opacity: 1; }
  100% { transform: translateY(-50px) scale(0.9); opacity: 0; }
}

/* Footer */
.combat-footer {
  border-top: 2.5px solid var(--ink);
  background: rgba(255,255,255,0.55);
  padding: 12px 20px;
  display: flex; gap: 14px; align-items: center;
}
.combat-skills { display: flex; gap: 10px; flex: 1; }
.sk {
  flex: 1;
  display: flex; align-items: center; gap: 8px;
  background: white;
  border: 2.5px solid var(--ink);
  border-radius: 14px;
  padding: 6px 10px;
  box-shadow: 0 4px 0 rgba(38,26,61,0.4);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
}
.sk:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(38,26,61,0.5); }
.sk--cooling { opacity: 0.6; }
.sk-icon { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; flex-shrink: 0; }
.sk-meta { line-height: 1.1; }
.sk-name { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.5px; }
.sk-cd   { font-size: 9px; color: var(--ink-muted); margin-top: 2px; }
.sk--ready .sk-cd { color: var(--hp-good); font-weight: 700; }

.combat-consumables { display: flex; gap: 6px; }
.cons {
  width: 56px;
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  padding: 4px;
  text-align: center;
  box-shadow: 0 3px 0 rgba(38,26,61,0.4);
}
.cons--empty { opacity: 0.4; padding-top: 18px; padding-bottom: 14px; }
.cons-icon { width: 28px; height: 28px; margin: 0 auto; border: 2px solid var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; }
.cons-name { font-size: 8px; letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; color: var(--ink-soft); }
.cons-qty { font-family: var(--font-display); font-size: 11px; }

.combat-speed { display: flex; gap: 4px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 3px; box-shadow: 0 3px 0 rgba(38,26,61,0.4); }
.speed-btn { font-family: var(--font-display); font-size: 11px; padding: 4px 10px; border: none; background: transparent; border-radius: 999px; cursor: pointer; }
.speed-btn--active { background: var(--brand-coral); color: white; box-shadow: 0 2px 0 rgba(38,26,61,0.4); }

/* Notes below */
.abc3-notes { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.abc3-note { background: white; border: var(--stroke); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow-stick-sm); font-size: 12px; line-height: 1.5; color: var(--ink-soft); display: flex; flex-direction: column; gap: 4px; }
.abc3-note b { font-family: var(--font-display); letter-spacing: 0.5px; color: var(--brand-coral); font-size: 12px; }
.abc3-note code { font-family: var(--font-mono); background: var(--paper); padding: 1px 4px; border-radius: 3px; }
</style>
