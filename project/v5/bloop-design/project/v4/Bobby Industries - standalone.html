document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

style>/* Bobby Industries V4 — stylesheet (cinétique, atelier nocturne) */\n\n:root {\n  --bi-ink:#040814; --bi-ink-soft:#0a1224; --bi-panel:#0e1830; --bi-line:#1a2748;\n  --bi-paper:#f4f7ff; --bi-dim:#c8d3e8;\n  --bi-electric:#2f80ff; --bi-glow:#6db6ff; --bi-warm:#ffd486;\n  --f-display:\"Archivo Black\",\"Helvetica Neue\",Arial,sans-serif;\n  --f-sans:\"Inter\",system-ui,sans-serif;\n  --f-mono:\"JetBrains Mono\",ui-monospace,monospace;\n  --ease:cubic-bezier(.23,1,.32,1);\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;background:var(--bi-ink);color:var(--bi-paper);font-family:var(--f-sans);overflow-x:hidden}\nbody{min-height:100vh;-webkit-font-smoothing:antialiased}\na{color:inherit;text-decoration:none}\nbutton{font:inherit;color:inherit;background:none;border:0;cursor:pointer}\nimg,svg{display:block;max-width:100%}\n::selection{background:var(--bi-electric);color:#fff}\n\n/* constellation bg */\n.bi-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 20% 10%,#0b1734 0%,#040814 60%)}\n.bi-bg canvas{width:100%;height:100%;display:block}\n.bi-grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .05 0 0 0 0 .06 0 0 0 0 .12 0 0 0 .6 0'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\")}\n\n/* cursor */\n.bi-cursor-halo{position:fixed;top:0;left:0;width:28px;height:28px;border:1px solid var(--bi-glow);border-radius:50%;pointer-events:none;z-index:9998;mix-blend-mode:difference;transition:width .25s,height .25s}\n.bi-cursor-halo.lg{width:70px;height:70px;background:rgba(47,128,255,.06)}\n@media (hover:none){.bi-cursor-halo{display:none}}\n\n/* typography helpers */\n.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bi-glow)}\n.h-mega{font-family:var(--f-display);font-size:clamp(64px,12vw,200px);line-height:.88;letter-spacing:-.03em;text-transform:uppercase;margin:0;font-weight:400}\n.h-xl{font-family:var(--f-display);font-size:clamp(40px,5.6vw,92px);line-height:.96;letter-spacing:-.02em;text-transform:uppercase;margin:0;font-weight:400}\n.h-l{font-family:var(--f-display);font-size:clamp(26px,3vw,44px);line-height:1;letter-spacing:-.015em;text-transform:uppercase;margin:0;font-weight:400}\n.body{font-size:clamp(15px,1.1vw,18px);line-height:1.65;color:var(--bi-dim);max-width:58ch}\n.lead{font-size:clamp(18px,1.7vw,24px);line-height:1.5;color:var(--bi-dim);max-width:60ch}\n.text-glow{color:var(--bi-glow)}\n.text-warm{color:var(--bi-warm)}\nem{font-style:normal;color:var(--bi-glow)}\nb{color:var(--bi-paper)}\n\n/* reveal */\n[data-reveal]{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}\n[data-reveal].in{opacity:1;transform:none}\n\n/* shell */\n.shell{width:min(1320px,100%);margin:0 auto;padding-inline:clamp(22px,4vw,64px)}\n\n/* ===================== ONBOARDING HERO ===================== */\n.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:clamp(30px,5vw,80px);padding:120px clamp(22px,4vw,64px) 80px;position:relative}\n.hero-left{display:flex;flex-direction:column;gap:28px}\n.hero-tag{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid rgba(47,128,255,.4);border-radius:2px;align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--bi-glow);background:rgba(47,128,255,.06)}\n.hero-tag::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--bi-electric);box-shadow:0 0 10px var(--bi-electric);animation:pulse 2s infinite}\n@keyframes pulse{50%{opacity:.35}}\n.hero-title{position:relative}\n.hero-title .ch{display:inline-block;opacity:0;transform:translateY(60%) rotate(8deg);animation:charIn .7s var(--ease) forwards}\n.hero-title .ln2 .ch{animation-delay:calc(var(--i,0)*22ms + 300ms)}\n.hero-title .ln1 .ch{animation-delay:calc(var(--i,0)*22ms)}\n.hero-title .ln3 .ch{animation-delay:calc(var(--i,0)*22ms + 600ms)}\n@keyframes charIn{to{opacity:1;transform:none}}\n.hero-title .accent{color:var(--bi-glow)}\n.hero-sub{display:flex;gap:20px;align-items:flex-start}\n.hero-index{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--bi-glow);white-space:nowrap;padding-top:6px}\n.hero-chips{display:flex;flex-wrap:wrap;gap:10px}\n.hero-chip{padding:9px 14px;border:1px solid var(--bi-line);border-radius:2px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bi-dim);transition:all .3s var(--ease);cursor:default}\n.hero-chip:hover,.hero-chip.on{color:var(--bi-glow);border-color:var(--bi-electric);background:rgba(47,128,255,.08)}\n.hero-cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}\n.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 24px;border:1px solid var(--bi-electric);font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;border-radius:2px;transition:all .3s var(--ease)}\n.btn.primary{background:var(--bi-electric);color:#fff}\n.btn.primary:hover{background:var(--bi-glow);border-color:var(--bi-glow);transform:translateY(-3px)}\n.btn.ghost{color:var(--bi-paper);background:transparent}\n.btn.ghost:hover{background:rgba(47,128,255,.08);transform:translateY(-3px)}\n\n.hero-right{position:relative;display:flex;justify-content:center;align-items:center;min-height:520px}\n.portrait-stage{position:relative;width:min(100%,460px);aspect-ratio:1/1.1}\n.portrait-ring{position:absolute;inset:-8% ;border:1px solid rgba(109,182,255,.28);border-radius:50%;animation:ringSpin 60s linear infinite}\n.portrait-ring::before{content:\"\";position:absolute;inset:-14px;border:1px dashed rgba(109,182,255,.12);b dd{margin:0;text-align:right}\n\n/* footer */\n.foot{padding:40px clamp(22px,4vw,64px);border-top:1px solid var(--bi-line);display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--bi-dim);text-transform:uppercase}\n.foot span{text-align:center}\n.foot a:hover{color:var(--bi-glow)}\n\n/* side nav */\n.sidenav{position:fixed;top:50%;left:18px;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:14px}\n.sidenav a{position:relative;width:10px;height:10px;border-radius:50%;border:1px solid var(--bi-line);transition:all .3s}\n.sidenav a:hover,.sidenav a.on{background:var(--bi-electric);border-color:var(--bi-glow);box-shadow:0 0 8px var(--bi-glow)}\n.sidenav a::after{content:attr(data-label);position:absolute;left:20px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bi-paper);background:var(--bi-panel);padding:4px 8px;border:1px solid var(--bi-line);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}\n.sidenav a:hover::after{opacity:1}\n\n/* top micro */\n.topbar{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;justify-content:space-between;padding:20px clamp(22px,4vw,64px);font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--bi-dim);text-transform:uppercase;pointer-events:none}\n.topbar span{background:rgba(4,8,20,.7);backdrop-filter:blur(8px);padding:6px 10px;border:1px solid var(--bi-line);pointer-events:auto}\n.topbar b{color:var(--bi-glow)}\n\n/* atelier link */\n.atelier-link{position:fixed;bottom:20px;right:20px;z-index:80;padding:10px 14px;border:1px solid rgba(47,128,255,.4);background:rgba(4,8,20,.8);backdrop-filter:blur(8px);font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--bi-glow);text-transform:uppercase;transition:all .3s}\n.atelier-link:hover{background:var(--bi-electric);color:#fff;border-color:var(--bi-electric)}\n.atelier-link::before{content:\"⚙\";margin-right:6px;display:inline-block;animation:ringSpin 8s linear infinite}\n\n/* responsive */\n@media (max-width:1080px){\n  .hero{grid-template-columns:1fr;padding:100px 22px 60px}\n  .hero-right{min-height:440px;margin-top:30px}\n  .hero-worlds{grid-template-columns:1fr}\n  .wd-grid{grid-template-columns:1fr}\n  .vinyl-lab-body{grid-template-columns:1fr}\n  .vinyl-playlist{position:relative;top:0}\n  .contact-grid{grid-template-columns:1fr}\n  .sidenav{display:none}\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- background layers -->\n<div class=\"bi-bg\"><canvas id=\"bgCanvas\"><\u002Fcanvas><\u002Fdiv>\n<div class=\"bi-grain\"><\u002Fdiv>\n\n<!-- top micro -->\n<div class=\"topbar\">\n  <span>BI · <b>atelier<\u002Fb> · paris · fr<\u002Fspan>\n  <span data-clock=\"\">— —:— —<\u002Fspan>\n<\u002Fdiv>\n\n<!-- side dot nav -->\n<nav class=\"sidenav\" aria-label=\"sections\">\n  <a href=\"#top\" data-label=\"accueil\"><\u002Fa>\n  <a href=\"#manifesto\" data-label=\"manifesto\"><\u002Fa>\n  <a href=\"#worlds\" data-label=\"les 3 mondes\"><\u002Fa>\n  <a href=\"#sound\" data-label=\"sound lab\"><\u002Fa>\n  <a href=\"#contact\" data-label=\"contact\"><\u002Fa>\n<\u002Fnav>\n\n<!-- atelier link -->\n<a href=\"atelier.html\" class=\"atelier-link\" data-hover=\"\">Atelier<\u002Fa>\n\n<!-- ======================= HERO ======================= -->\n<section class=\"hero\" id=\"top\">\n  <div class=\"hero-left\">\n    <span class=\"hero-tag\">En ligne · 2026 · dispo pour nouveaux projets<\u002Fspan>\n    <h1 class=\"h-mega hero-title\" id=\"heroTitle\">\n      <span class=\"ln1\">BOBBY<\u002Fspan><br>\n      <span class=\"ln2 accent\">INDUSTRIES.<\u002Fspan>\n    <\u002Fh1>\n    <div class=\"hero-sub\">\n      <div class=\"hero-index\">01 / qui<\u002Fdiv>\n      <p class=\"lead\">Je m'appelle <b>Bobby<\u002Fb>. J'ai 22 ans, je suis designer et je vis à Paris. J'ai un atelier, pas un portfolio. Il tient debout sur trois choses : <b class=\"text-glow\">drg_music<\u002Fb>, un label. <b class=\"text-glow\">Les Coyotes<\u002Fb>, une équipe de basket dissidente. <b class=\"text-glow\">L'atelier<\u002Fb>, où je fais du code, des objets, des images.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"hero-sub\">\n      <div class=\"hero-index\">02 / comment<\u002Fdiv>\n      <div class=\"hero-chips\">\n        <span class=\"hero-chip on\">Design éditorial<\u002Fspan>\n        <span class=\"hero-chip\">Direction artistique<\u002Fspan>\n        <span class=\"hero-chip\">Code créatif<\u002Fspan>\n        <span class=\"hero-chip\">Identités sportives<\u002Fspan>\n        <span class=\"hero-chip\">Objets numériques<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-cta-row\">\n      <a href=\"#manifesto\" class=\"btn primary\" data-hover=\"\">Entrer dans l'atelier →<\u002Fa>\n      <a href=\"#sound\" class=\"btn ghost\" data-hover=\"\">Écouter un disque<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-right\">\n    <div class=\"portrait-stage\">\n      <div class=\"portrait-ring\"><\u002Fdiv>\n      <div class=\"portrait-img\"><img src=\"35cf543e-04d6-4f2b-884f-b6ae70e8e894\" alt=\"Bobby\"><div class=\"portrait-scanline\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"portrait-tag\"><b>Bobby / 22 ans<\u002Fb>designer · paris · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-worlds\">\n    <a href=\"#worlds\" class=\"world\" data-hover=\"\">\n      <span class=\"world-num\">monde 01<\u002Fspan>\n      <span class=\"world-name\">drg_music<\u002Fspan>\n      <span class=\"world-sub\">Label, pochettes, identités. Cinq disques sortis.<\u002Fspan>\n    <\u002Fa>\n    <a href=\"#worlds\" class=\"world\" data-hover=\"\">\n      <span class=\"world-num\">monde 02<\u002Fspan>\n      <span class=\"world-name\">Les Coyotes<\u002Fspan>\n      <span class=\"world-sub\">Équipe de basket. Uniformes, trucs imprimés, rituels.<\u002Fspan>\n    <\u002Fa>\n    <a href=\"#worlds\" class=\"world\" data-hover=\"\">\n      <span class=\"world-num\">monde 03<\u002Fspan>\n      <span class=\"world-name\">L'Atelier<\u002Fspan>\n      <span class=\"world-sub\">Code créatif, objets numériques, commandes ouvertes.<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ======================= MANIFESTO (pinned) ======================= -->\n<section class=\"manifesto-pin\" id=\"manifesto\">\n  <div class=\"manifesto-stage\">\n    <div class=\"manifesto-inner\">\n      <div class=\"manifesto-eye\">// manifeste · scrolle pour lire<\u002Fdiv>\n      <h2 class=\"manifesto-body\" id=\"manifestoBody\"><\u002Fh2>\n      <div class=\"manifesto-rhyme\">bi · <b>un atelier<\u002Fb> · pas un portfolio<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ======================= WORLDS DETAIL ======================= -->\n<section class=\"worlds-detail\" id=\"worlds\">\n  <div class=\"shell\">\n    <div class=\"wd-head\" data-reveal=\"\">\n      <span class=\"eyebrow\">// les trois mondes · pourquoi ils existent<\u002Fspan>\n      <h2 class=\"h-xl\" style=\"margin-top:18px\">Trois pratiques,<br>une même main.<\u002Fh2>\n      <p class=\"body\">Je ne fais pas des \"projets\". Je fais des <b>mondes<\u002Fb> — chacun avec ses règles, sa matière, ses gens. Ils s'échangent des choses en secret : une typo du label arrive sur un maillot, un geste de basket finit dans une pochette. C'est comme ça que ça tient.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"wd-grid\">\n      <div class=\"wd-card\" data-reveal=\"\" data-hover=\"\">\n        <div class=\"wd-cat\">monde 01 · son<\u002Fdiv>\n        <h3 class=\"wd-title\">drg_music<\u002Fh3>\n        <p class=\"wd-text\">Un label que je dirige depuis l'atelier. Je dessine les pochettes, les identités, la typo de chaque disque. Cinq sorties, une esthétique qui s'affine. Pas de compromis sur le son, pas de compromis sur l'image.<\u002Fp>\n        <div class=\"wd-stack\">\n          <span class=\"wd-tag\">pochettes<\u002Fspan><span class=\"wd-tag\">typo<\u002Fspan><span class=\"wd-tag\">clips<\u002Fspan><span class=\"wd-tag\">direction<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"wd-card\" data-reveal=\"\" data-hover=\"\">\n        <div class=\"wd-cat\">monde 02 · corps<\u002Fdiv>\n        <h3 class=\"wd-title\">Les Coyotes<\u002Fh3>\n        <p class=\"wd-text\">Équipe de basket à Paris. J'en dessine l'identité visuelle : uniformes, prints, médias sociaux, rituels de match. Un terrain est un stage. Un maillot est un support. Un logo est un cri.<\u002Fp>\n        <div class=\"wd-stack\">\n          <span class=\"wd-tag\">uniformes<\u002Fspan><span class=\"wd-tag\">logo<\u002Fspan><span class=\"wd-tag\">imprimés<\u002Fspan><span class=\"wd-tag\">équipe<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"wd-card\" data-reveal=\"\" data-hover=\"\">\n        <div class=\"wd-cat\">monde 03 · matière<\u002Fdiv>\n        <h3 class=\"wd-title\">L'Atelier<\u002Fh3>\n        <p class=\"wd-text\">Ce que vous regardez. Code créatif, objets numériques, commandes pour des gens que j'aime bien. Identités de marques, sites, livres, tout ce qui demande de la main. Je prends peu de commandes — je les choisis bien.<\u002Fp>\n        <div class=\"wd-stack\">\n          <span class=\"wd-tag\">identités<\u002Fspan><span class=\"wd-tag\">sites<\u002Fspan><span class=\"wd-tag\">livres<\u002Fspan><span class=\"wd-tag\">objets num.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ======================= MARQUEE ======================= -->\n<section class=\"marquee\" aria-hidden=\"true\">\n  <div class=\"marquee-track\">\n    <span>drg_music<\u002Fspan><span>les coyotes<\u002Fspan><span>l'atelier<\u002Fspan><span>paris<\u002Fspan><span>bi · 2026<\u002Fspan>\n    <span>drg_music<\u002Fspan><span>les coyotes<\u002Fspan><span>l'atelier<\u002Fspan><span>paris<\u002Fspan><span>bi · 2026<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ======================= VINYL LAB ======================= -->\n<section class=\"vinyl-section\" id=\"sound\">\n  <div class=\"shell\">\n    <div id=\"vinylRoot\" data-reveal=\"\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ======================= CONTACT ======================= -->\n<section class=\"contact\" id=\"contact\">\n  <div class=\"shell\">\n    <div class=\"contact-grid\">\n      <div class=\"contact-left\" data-reveal=\"\">\n        <span class=\"eyebrow\">// prendre contact<\u002Fspan>\n        <h2 class=\"h-xl\" style=\"margin-top:18px\">On se parle ?<\u002Fh2>\n        <p class=\"lead\">Commandes ouvertes pour identité visuelle, design éditorial, sites. Je réponds à tout, toujours. Compte <em>72 heures<\u002Fem> avant d'avoir une vraie réponse.<\u002Fp>\n        <div class=\"contact-cta\">\n          <a href=\"mailto:bobby@industries.fr\" class=\"btn primary\" data-hover=\"\">bobby@industries.fr →<\u002Fa>\n          <a href=\"atelier.html\" class=\"btn ghost\" data-hover=\"\">Voir l'atelier<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"contact-card\" data-reveal=\"\">\n        <h3>Coordonnées<\u002Fh3>\n        <dl>\n          <div class=\"contact-row\"><dt>email<\u002Fdt><dd>bobby@industries.fr<\u002Fdd><\u002Fdiv>\n          <div class=\"contact-row\"><dt>instagram<\u002Fdt><dd>@bobby.industries<\u002Fdd><\u002Fdiv>\n          <div class=\"contact-row\"><dt>label<\u002Fdt><dd>drg_music.fr<\u002Fdd><\u002Fdiv>\n          <div class=\"contact-row\"><dt>équipe<\u002Fdt><dd>lescoyotes.paris<\u002Fdd><\u002Fdiv>\n          <div class=\"contact-row\"><dt>lieu<\u002Fdt><dd>Paris, 11e<\u002Fdd><\u002Fdiv>\n          <div class=\"contact-row\"><dt>dispo<\u002Fdt><dd>mars 2026 →<\u002Fdd><\u002Fdiv>\n        <\u002Fdl>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ======================= FOOTER ======================= -->\n<footer class=\"foot\">\n  <div>© 2026 Bobby Industries<\u002Fdiv>\n  <span>un atelier · pas un portfolio<\u002Fspan>\n  <div style=\"text-align:right\"><a href=\"atelier.html\">atelier →<\u002Fa><\u002Fdiv>\n<\u002Ffooter>\n\n<!-- scripts -->\n<script src=\"b0df32e0-1db9-4c28-ab63-483ca403c602\"><\u002Fscript>\n<script src=\"9f1f4863-6ad6-46b1-9bda-6d4171aa3ed0\"><\u002Fscript>\n<script>\n(function(){\n  // bg canvas\n  const cvs = document.getElementById(\"bgCanvas\");\n  window.BI_initConstellation(cvs);\n  window.BI_initCursor();\n\n  // reveal\n  window.BI_observeReveal(document.querySelectorAll(\"[data-reveal]\"));\n\n  // hero title char split for per-char animation\n  (function splitHero(){\n    document.querySelectorAll(\".hero-title span\").forEach(line=>{\n      const txt = line.textContent;\n      line.innerHTML = \"\";\n      [...txt].forEach((c,i)=>{\n        const s = document.createElement(\"span\");\n        s.className = \"ch\";\n        s.textContent = c===\" \"?\"\\u00a0\":c;\n        s.style.setProperty(\"--i\", i);\n        line.appendChild(s);\n      });\n    });\n  })();\n\n  // clock\n  function tickClock(){\n    const d = new Date();\n    const h = String(d.getHours()).padStart(2,\"0\");\n    const m = String(d.getMinutes()).padStart(2,\"0\");\n    document.querySelector(\"[data-clock]\").innerHTML = \"Paris · <b>\"+h+\":\"+m+\"<\u002Fb>\";\n  }\n  tickClock(); setInterval(tickClock, 30000);\n\n  // sidenav active state\n  const sections = [\"top\",\"manifesto\",\"worlds\",\"sound\",\"contact\"];\n  const dots = Array.from(document.querySelectorAll(\".sidenav a\"));\n  function updateNav(){\n    const y = window.scrollY + innerHeight*0.4;\n    let active = 0;\n    sections.forEach((id,i)=>{\n      const el = document.getElementById(id);\n      if (el && el.offsetTop <= y) active = i;\n    });\n    dots.forEach((d,i)=>d.classList.toggle(\"on\", i===active));\n  }\n  updateNav();\n  addEventListener(\"scroll\", updateNav, {passive:true});\n\n  // manifesto scroll-synced words\n  const manifestoText = [\n    {w:\"Je\", a:false},{w:\"fais\", a:false},{w:\"des\", a:false},{w:\"choses\", a:true},\n    {w:\"à\", a:false},{w:\"la\", a:false},{w:\"main,\", a:false},\n    {w:\"pour\", a:false},{w:\"des\", a:false},{w:\"gens\", a:true},{w:\"que\", a:false},{w:\"j'aime\", a:true},{w:\"bien.\", a:false},\n    {w:\"Un\", a:false},{w:\"atelier\", a:true},{w:\"—\", a:false},\n    {w:\"pas\", a:false},{w:\"un\", a:false},{w:\"portfolio.\", a:true},\n    {w:\"Cinq\", a:false},{w:\"disques,\", a:false},\n    {w:\"une\", a:false},{w:\"équipe,\", a:false},\n    {w:\"mille\", a:false},{w:\"essais.\", a:true},\n    {w:\"Et\", a:false},{w:\"toi\", a:true},{w:\",\", a:false},{w:\"tu\", a:false},{w:\"cherches\", a:false},{w:\"quoi?\", a:true}\n  ];\n  const mBody = document.getElementById(\"manifestoBody\");\n  mBody.innerHTML = manifestoText.map((x,i)=>`<span class=\"w ${x.a?\"accent\":\"\"}\" data-i=\"${i}\">${x.w}<\u002Fspan>`).join(\" \");\n  const mWords = Array.from(mBody.querySelectorAll(\".w\"));\n  const pin = document.getElementById(\"manifesto\");\n\n  function updateManifesto(){\n    const rect = pin.getBoundingClientRect();\n    const total = pin.offsetHeight - innerHeight;\n    const progress = Math.max(0, Math.min(1, -rect.top / total));\n    const reveal = Math.floor(progress * (mWords.length+2));\n    mWords.forEach((w,i)=> w.classList.toggle(\"on\", i<reveal));\n  }\n  updateManifesto();\n  addEventListener(\"scroll\", updateManifesto, {passive:true});\n\n  // vinyl lab\n  window.BI_initVinyls(document.getElementById(\"vinylRoot\"));\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
